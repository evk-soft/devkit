name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege by default. A job that needs more must ask for it explicitly.
permissions:
  contents: read

jobs:
  node:
    name: Node 24 (pnpm) - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      # Actions are pinned to commit SHAs: a mutable tag is a third-party push away from running
      # arbitrary code with this workflow's token. The trailing comment records the human-readable
      # tag the SHA corresponded to when it was pinned.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Enable Corepack
        run: corepack enable
      - name: Use pnpm
        run: corepack prepare pnpm@11.20.0 --activate
      - name: Get pnpm store path
        shell: bash
        run: echo "PNPM_STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"
      - name: Cache pnpm store
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.PNPM_STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - name: Install
        env:
          HUSKY: 0
        run: pnpm install --frozen-lockfile
      # `check` already chains check:ai-tooling, which expands to typecheck && test && pack:check,
      # so every Stage 1 gate command runs here without a separate step.
      - name: Check
        run: pnpm check
      - name: Structure guards
        run: pnpm run check:structure
      - name: Supply-chain guards
        run: pnpm run check:supply-chain
      # Deliberately its own step rather than part of `check`: Stage 1 phase gates invoke
      # `pnpm check` literally and that command must not acquire new failure modes.
      - name: Test type guard
        run: pnpm run check:test-types

  bun:
    name: Bun 1.3 (runtime smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.0"
      - name: Runtime check (bun)
        run: bun ./scripts/runtime-check.mjs
